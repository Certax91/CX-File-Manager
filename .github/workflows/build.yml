name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log; then
            # Fehlerzeilen als Hinweise ausgeben, damit sie ohne Anmeldung lesbar sind
            { grep -E '^e: ' build.log; grep -A 6 'What went wrong' build.log; } | grep -v '^> Task' | head -40 > errors.txt
            echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' errors.txt)"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Ordnungshelfer.apk
      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-build-${{ github.run_number }}
          name: Ordnungshelfer (Build ${{ github.run_number }})
          files: Ordnungshelfer.apk
