name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log; then
            # Fehlerzeilen als Hinweise ausgeben, damit sie ohne Anmeldung lesbar sind
            grep -E '^e: |error:|What went wrong|Could not|FAILURE|> ' build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Ordnungshelfer.apk
      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: Ordnungshelfer (Build ${{ github.run_number }})
          files: Ordnungshelfer.apk
